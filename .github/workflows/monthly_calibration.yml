name: Tactical Swing OS monthly calibration

on:
  workflow_dispatch:
  schedule:
    # 03:30 UTC is 12:30 JST.
    - cron: "30 3 1 * *"

permissions:
  contents: read

jobs:
  monthly-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build latest evaluations for monthly calibration
        run: |
          python src/build_latest_evaluations.py || echo "warning: latest evaluations failed; continuing with fallback"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Build monthly calibration
        run: python src/build_monthly_calibration.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Monthly calibration draft (previous month; observation only, no decisions)
        # 2026-11-09: 10月は月次が3つとも抜けた(遡及コーパスの延長・数値・文書)。草稿を毎月必ず作る。
        # 決定は書かない。Codex の月次自動化 tso がこの草稿を docs/ へ PR する(契約は docs/monthly_calibration.md)。
        run: python tools/monthly_calibration_run.py || echo "warning - monthly calibration draft failed; continuing"

      - name: Upload monthly calibration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tactical-swing-os-monthly-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            reports/monthly/*.md
            data/retro/market_daily.csv
            results/monthly_calibration.csv
            results/monthly_calibration.json
            models/weights.json
