name: Tactical Swing OS news narratives

on:
  workflow_dispatch:
  schedule:
    # 21:50 UTC is 06:50 JST.
    - cron: "50 21 * * *"

# governance_reform_2026-07 §2 #6: data/ 配下のデータ追記コミットのみ許可
permissions:
  contents: write

jobs:
  news-narratives:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # mainへpushするためDeploy key認証(main-merge-gate bypass、§6)
          ssh-key: ${{ secrets.TSO_BOT_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news headlines
        run: python src/fetch_news.py --hours 48 --max-items 100 --timeout-seconds 8 --global-timeout-seconds 90

      - name: Classify news narratives
        run: python src/classify_news_narratives.py

      - name: Build narrative memory (Phase 29.2)
        run: python src/build_narrative_memory.py

      - name: Retrieve similar narratives
        run: python src/retrieve_similar_narratives.py
        env:
          TSO_EMBEDDING_PROVIDER: ${{ vars.TSO_EMBEDDING_PROVIDER || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Evaluate narrative similarity
        run: python src/evaluate_narrative_similarity.py

      - name: Commit narrative memory store (data append only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "tso-actions-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/narrative_memory.csv
          if git diff --cached --quiet; then
            echo "no memory changes to commit"
          else
            git commit -m "Append narrative memory store [skip ci]" \
              -m "Data-append commit permitted by governance_reform_2026-07 (data/ only)."
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload news narrative artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tactical-swing-os-news-narratives-${{ github.run_id }}
          if-no-files-found: error
          path: |
            reports/news/*.md
            results/news_headlines.csv
            results/news_headlines.json
            results/news_narrative_scores.csv
            results/news_narrative_scores.json
            results/narrative_memory_summary.json
            results/similar_narrative_cases.csv
            results/similar_narrative_summary.json
            results/narrative_similarity_evaluation.json
            reports/narrative/*_similar_narratives.md
