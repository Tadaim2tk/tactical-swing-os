name: Tactical Swing OS news narratives

on:
  workflow_dispatch:
  schedule:
    # 21:50 UTC is 06:50 JST.
    - cron: "50 21 * * *"

permissions:
  contents: read

jobs:
  news-narratives:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news headlines
        run: python src/fetch_news.py --hours 48 --max-items 100 --timeout-seconds 8 --global-timeout-seconds 90

      - name: Classify news narratives
        run: python src/classify_news_narratives.py

      - name: Upload news narrative artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tactical-swing-os-news-narratives-${{ github.run_id }}
          if-no-files-found: error
          path: |
            reports/news/*.md
            results/news_headlines.csv
            results/news_headlines.json
            results/news_narrative_scores.csv
            results/news_narrative_scores.json
