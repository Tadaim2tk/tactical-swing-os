name: Tactical Swing OS daily cycle

on:
  workflow_dispatch:
  schedule:
    # 21:55 UTC is 06:55 JST.
    - cron: "55 21 * * *"

# governance_reform_2026-07 §2 #6:
# src / docs / .github への自動pushは禁止のまま。
# results / reports / data 配下へのデータ追記コミットのみ Actions bot に許可。
permissions:
  contents: write

jobs:
  daily-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data
        run: python src/fetch_market.py

      - name: Record market context snapshot (point-in-time feature store)
        run: |
          rm -f results/.mctx_failed
          python src/export_market_context_snapshot.py || {
            echo "::error::market context snapshot failed; no point-in-time row recorded for this run"
            mkdir -p results && touch results/.mctx_failed
          }

      - name: Generate signals (base + shadow weights)
        run: python src/generate_signal.py

      - name: Append generated signals to generated ledger
        run: python src/append_generated_signals.py

      - name: Evaluate signals
        run: python src/evaluate_signal.py || true

      - name: Link shadow outcomes (promotion gate input)
        run: |
          python src/link_shadow_outcomes.py || echo "warning - shadow outcome link failed; gate stays honest-blocked"

      - name: Score prediction log (all judgements, retro)
        run: |
          python src/score_prediction_log.py || echo "warning - prediction log scoring failed; continuing"
          python src/simulate_execution.py || echo "warning - execution simulation failed; continuing"

      - name: Build report
        run: python src/build_report.py

      - name: Throughput watch (売買頻度の監視)
        # 2026-11-02: 9/14 の週から注文も見立ても崖になっていたのに、11/2 に人間が指摘するまで
        # 誰も数えていなかった。直近14日を前56日と比べ、ALERT ならこのジョブを赤にする
        # (snapshot 欠落と同じ流儀: サイクルは最後まで走らせ、ジョブの色で知らせる)。
        # 観測だけ。提案・配分・採用に入る数は変えない。
        run: |
          rm -f results/.throughput_alert results/.throughput_alert_new
          set +e
          python tools/throughput_watch.py --fail-on-alert --transition-file results/.throughput_alert_new
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            echo "::error::throughput watch ALERT - 売買頻度が床を割っている (reports/throughput_watch.md)"
            touch results/.throughput_alert
          elif [ "$rc" != "0" ]; then
            echo "::warning::throughput watch failed to run (rc=$rc); continuing"
          elif grep -q "^status=WARN" <(python tools/throughput_watch.py --check-only 2>/dev/null); then
            echo "::warning::throughput watch WARN - 売買頻度が基準の半分以下 (reports/throughput_watch.md)"
          fi

      - name: Ledger freshness (取込が止まっていないか)
        # 2026-11-11: 取込の経路(ChatGPT → 台帳)は外の道具に依存していて黙って止まる。10/28 のレポートから
        # Codex が本文を読めなくなり 11/3〜11/9 は取込が止まったが、このジョブは緑のままだった
        # (上の throughput watch は台帳の最終日を基準に数えるので、台帳と一緒に止まる)。
        # 「今日(JST)」から数え、2日続けて増えていなければ ALERT としてこのジョブを赤にする。観測だけ。
        run: |
          rm -f results/.ledger_stale results/.ledger_check_error
          set +e
          out=$(python tools/ledger_freshness.py --fail-on-alert)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" = "2" ]; then
            echo "::error::ledger freshness ALERT - 台帳(data/signal_log.csv)が2日続けて増えていないか、読めない。取込の経路を確認 (docs/operations_runbook.md §1g)"
            touch results/.ledger_stale
          elif [ "$rc" != "0" ]; then
            # 監視そのものが動かなかった。ここを警告で流すと「黙って止まる」を拾う警報が黙って止まる
            # (#211 Codex P2)。サイクルは最後まで走らせ、ジョブは赤にする。
            echo "::error::ledger freshness could not run (rc=$rc) - 鮮度の確認そのものが動かなかった。このステップのログを見る"
            touch results/.ledger_check_error
          elif echo "$out" | grep -q "^status=WARN"; then
            echo "::warning::ledger freshness WARN - 台帳が1日ぶん遅れている(次の取込が拾えば戻る)"
          fi

      - name: Sync to Google Sheets
        run: python src/sync_to_sheets.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Commit daily ledgers (data/results append only)
        if: github.ref == 'refs/heads/main'
        env:
          TSO_BOT_DEPLOY_KEY: ${{ secrets.TSO_BOT_DEPLOY_KEY }}
        run: |
          git config user.name "tso-actions-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # governance_reform_2026-07: data/ 配下のデータ追記のみ。src/docs/.github は触らない。
          # 機械生成分は data/generated_signal_log.csv へ隔離(予測台帳 data/signal_log.csv はGPT判断専用、
          # 2026-08-25 人間決定)。summary json は results/*.json が gitignore のため add しない(#112由来の
          # 3日連続コミット失敗の原因。診断はアーティファクトで配布)。
          git add data/generated_signal_log.csv data/shadow_weight_comparisons.csv data/shadow_outcome_diffs.csv data/prediction_log_scores.csv data/execution_simulation.csv data/market_context_daily.csv data/throughput_watch.csv
          if git diff --cached --quiet; then
            echo "no ledger changes to commit"
          else
            git commit -m "Append daily TSO ledgers [skip ci]" \
              -m "Data/results append commit permitted by governance_reform_2026-07 (data/results only, no code/docs/workflow changes)."
            git pull --rebase origin main
            # main-merge-gate ruleset (§6): mainへの直接pushは専用鍵のみ通過。鍵はpush直前に
            # 書き込み直後に破棄する(依存インストールやスクリプト実行中に晒さない: #121 Codex P1)。
            key_file=$(mktemp)
            trap 'rm -f "$key_file"' EXIT
            printf '%s\n' "$TSO_BOT_DEPLOY_KEY" > "$key_file"
            GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              git push "git@github.com:$GITHUB_REPOSITORY.git" HEAD:main
          fi

      - name: Fail if the point-in-time snapshot was not recorded, throughput is in ALERT, or the ledger stopped growing / could not be checked
        if: always()
        run: |
          # この欠落は後から埋められない(当時の値は再構成すると lookahead 汚染になる)。
          # 日次サイクル自体は最後まで走らせたうえで、ジョブは赤にして通知を出す。
          fail=0
          if [ -f results/.mctx_failed ]; then
            echo "::error::point-in-time market context snapshot missing for this run - this gap cannot be backfilled later"
            fail=1
          else
            echo "market context snapshot recorded"
          fi
          if [ -f results/.throughput_alert ]; then
            echo "::error::throughput watch ALERT - 売買頻度が床を割っている。reports/throughput_watch.md を読む"
            fail=1
          fi
          if [ -f results/.ledger_stale ]; then
            echo "::error::ledger freshness ALERT - 台帳が2日続けて増えていないか、読めない。取込の経路が止まっている (docs/operations_runbook.md §1g)"
            fail=1
          fi
          if [ -f results/.ledger_check_error ]; then
            echo "::error::ledger freshness could not run - 台帳の鮮度を確認できなかった(Ledger freshness ステップのログを見る)"
            fail=1
          fi
          exit $fail

      - name: Upload TSO artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tactical-swing-os-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data/raw/*.csv
            results/*.csv
            results/*.json
            reports/*.md
            reports/model_state/shadow_weight_impact.md
