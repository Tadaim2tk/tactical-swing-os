name: Tactical Swing OS daily cycle

on:
  workflow_dispatch:
  schedule:
    # 21:55 UTC is 06:55 JST.
    - cron: "55 21 * * *"

# governance_reform_2026-07 §2 #6:
# src / docs / .github への自動pushは禁止のまま。
# results / reports / data 配下へのデータ追記コミットのみ Actions bot に許可。
permissions:
  contents: write

jobs:
  daily-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # main-merge-gate ruleset (2026-08-27): mainへの直接pushはDeploy keyのみbypass可。
          # 既定のGITHUB_TOKENでは必須チェックに弾かれるため、pushするワークフローは
          # この鍵でcheckout/pushする(governance_reform_2026-07 §6)。
          ssh-key: ${{ secrets.TSO_BOT_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data
        run: python src/fetch_market.py

      - name: Record market context snapshot (point-in-time feature store)
        run: |
          rm -f results/.mctx_failed
          python src/export_market_context_snapshot.py || {
            echo "::error::market context snapshot failed; no point-in-time row recorded for this run"
            mkdir -p results && touch results/.mctx_failed
          }

      - name: Generate signals (base + shadow weights)
        run: python src/generate_signal.py

      - name: Append generated signals to official ledger
        run: python src/append_generated_signals.py

      - name: Evaluate signals
        run: python src/evaluate_signal.py || true

      - name: Link shadow outcomes (promotion gate input)
        run: |
          python src/link_shadow_outcomes.py || echo "warning - shadow outcome link failed; gate stays honest-blocked"

      - name: Score prediction log (all judgements, retro)
        run: |
          python src/score_prediction_log.py || echo "warning - prediction log scoring failed; continuing"
          python src/simulate_execution.py || echo "warning - execution simulation failed; continuing"

      - name: Build report
        run: python src/build_report.py

      - name: Sync to Google Sheets
        run: python src/sync_to_sheets.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Commit daily ledgers (data/results append only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "tso-actions-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # governance_reform_2026-07: data/ 配下のデータ追記のみ。src/docs/.github は触らない。
          # 機械生成分は data/generated_signal_log.csv へ隔離(予測台帳 data/signal_log.csv はGPT判断専用、
          # 2026-08-25 人間決定)。summary json は results/*.json が gitignore のため add しない(#112由来の
          # 3日連続コミット失敗の原因。診断はアーティファクトで配布)。
          git add data/generated_signal_log.csv data/shadow_weight_comparisons.csv data/shadow_outcome_diffs.csv data/prediction_log_scores.csv data/execution_simulation.csv data/market_context_daily.csv
          if git diff --cached --quiet; then
            echo "no ledger changes to commit"
          else
            git commit -m "Append daily TSO ledgers [skip ci]" \
              -m "Data/results append commit permitted by governance_reform_2026-07 (data/results only, no code/docs/workflow changes)."
            git pull --rebase origin main
            git push origin main
          fi

      - name: Fail if the point-in-time snapshot was not recorded
        if: always()
        run: |
          # この欠落は後から埋められない(当時の値は再構成すると lookahead 汚染になる)。
          # 日次サイクル自体は最後まで走らせたうえで、ジョブは赤にして通知を出す。
          if [ -f results/.mctx_failed ]; then
            echo "::error::point-in-time market context snapshot missing for this run - this gap cannot be backfilled later"
            exit 1
          fi
          echo "market context snapshot recorded"

      - name: Upload TSO artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tactical-swing-os-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data/raw/*.csv
            results/*.csv
            results/*.json
            reports/*.md
            reports/model_state/shadow_weight_impact.md
