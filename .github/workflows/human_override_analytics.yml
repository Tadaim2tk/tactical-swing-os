name: Tactical Swing OS human override analytics

on:
  workflow_dispatch:
  schedule:
    # 04:50 UTC is 13:50 JST.
    - cron: "50 4 * * 6"

permissions:
  contents: read

jobs:
  human-override-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build latest evaluations
        run: |
          python src/build_latest_evaluations.py || echo "warning: latest evaluations failed; continuing"

      - name: Analyze reason codes
        run: |
          python src/analyze_reason_codes.py || echo "warning: reason code analysis failed; continuing"

      - name: Propose rule updates
        run: |
          python src/propose_rule_updates.py || echo "warning: rule update proposals failed; continuing"

      - name: Propose model state updates
        run: |
          python src/propose_model_state_updates.py || echo "warning: model state proposals failed; continuing"

      - name: Audit model state proposals
        run: |
          python src/audit_model_state_proposals.py || echo "warning: model state audit failed; continuing"

      - name: Build weights patch proposal
        run: |
          python src/build_weights_patch.py || echo "warning: weights patch proposal failed; continuing"

      - name: Review weights patch proposal
        run: |
          python src/review_weights_patch.py || echo "warning: weights patch review failed; continuing"

      - name: Track proposal adoption
        run: |
          python src/track_proposal_adoption.py || echo "warning: proposal adoption tracking failed; continuing"

      - name: Build weight version history
        run: |
          python src/build_weight_version_history.py || echo "warning: weight version history failed; continuing"

      - name: Build meta learning
        run: |
          python src/build_meta_learning.py || echo "warning: meta learning failed; continuing"

      - name: Build auto calibration candidates
        run: |
          python src/build_auto_calibration_candidates.py || echo "warning: auto calibration candidates failed; continuing"

      - name: Build human override analytics
        run: python src/build_human_override_analytics.py

      - name: Upload human override analytics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tactical-swing-os-human-override-analytics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            reports/model_state/*.md
            results/proposal_adoption_tracking.csv
            results/proposal_adoption_tracking.json
            results/proposal_adoption_tracking_summary.json
            results/weight_version_history.csv
            results/weight_version_history.json
            results/weight_version_history_summary.json
            results/proposal_impact.csv
            results/proposal_impact.json
            results/proposal_impact_summary.json
            results/meta_learning.csv
            results/meta_learning.json
            results/meta_learning_summary.json
            results/auto_calibration_candidates.csv
            results/auto_calibration_candidates.json
            results/auto_calibration_candidates_summary.json
            results/human_override_analytics.csv
            results/human_override_analytics.json
            results/human_override_analytics_summary.json
            reports/model_state/*_human_override_analytics.md
