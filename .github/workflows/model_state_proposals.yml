name: Tactical Swing OS model state proposals

on:
  workflow_dispatch:
  schedule:
    # 03:55 UTC is 12:55 JST.
    - cron: "55 3 * * 6"

permissions:
  contents: read

jobs:
  model-state-proposals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build latest evaluations
        run: |
          python src/build_latest_evaluations.py || echo "warning: latest evaluations failed; continuing"

      - name: Analyze reason codes
        run: |
          python src/analyze_reason_codes.py || echo "warning: reason code analysis failed; continuing"

      - name: Propose rule updates
        run: |
          python src/propose_rule_updates.py || echo "warning: rule update proposals failed; continuing"

      - name: Propose model state updates
        run: python src/propose_model_state_updates.py

      - name: Upload model state proposal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tactical-swing-os-model-state-proposals-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            reports/model_state/*.md
            results/model_state_update_proposals.csv
            results/model_state_update_proposals.json
            results/model_state_update_summary.json
