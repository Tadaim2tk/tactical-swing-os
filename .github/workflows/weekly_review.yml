name: Tactical Swing OS weekly review

on:
  workflow_dispatch:
  schedule:
    # 03:10 UTC is 12:10 JST.
    - cron: "10 3 * * 6"

permissions:
  contents: read

jobs:
  weekly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build latest evaluations for weekly review
        run: |
          python src/build_latest_evaluations.py || echo "warning: latest evaluations failed; continuing with fallback"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Build audit report
        run: python src/build_audit_report.py

      - name: Build weekly review
        run: python src/build_weekly_review.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Upload weekly review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tactical-swing-os-weekly-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            reports/weekly/*.md
            reports/audit/*.md
            results/weekly_review.csv
            results/weekly_review.json
            results/latest_audit_status.txt
