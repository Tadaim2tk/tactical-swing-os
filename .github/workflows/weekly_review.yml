name: Tactical Swing OS weekly review

on:
  workflow_dispatch:
  schedule:
    # 03:10 UTC is 12:10 JST.
    - cron: "10 3 * * 6"

permissions:
  contents: read

jobs:
  weekly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build latest evaluations for weekly review
        run: |
          python src/build_latest_evaluations.py || echo "warning: latest evaluations failed; continuing with fallback"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Build audit report
        run: python src/build_audit_report.py

      - name: Build weekly review
        run: python src/build_weekly_review.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Append weekly review to the durable ledger
        run: python src/append_weekly_review_log.py --apply

      - name: Commit weekly review ledger (data/ append only)
        if: github.ref == 'refs/heads/main'
        env:
          TSO_BOT_DEPLOY_KEY: ${{ secrets.TSO_BOT_DEPLOY_KEY }}
        run: |
          git config user.name "tso-actions-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # runbook §1c: results/ と reports/ は .gitignore 済みで、実体は retention 指定の無い
          # CI artifact のみ(既定90日)。週次でしか作られない値が90日で消えていたため、
          # data/ 配下へ追記して永続化する。data/ のみ・追記のみ(governance_reform_2026-07)。
          git add data/weekly_review_log.csv
          if git diff --cached --quiet; then
            echo "no weekly review changes to commit"
          else
            git commit -m "Append weekly review ledger [skip ci]" \
              -m "Data append commit permitted by governance_reform_2026-07 (data/ only, no code/docs/workflow changes)."
            git pull --rebase origin main
            # 鍵はpush直前に書き、直後に破棄する(依存インストール中に晒さない: #121 Codex P1)
            key_file=$(mktemp)
            trap 'rm -f "$key_file"' EXIT
            printf '%s\n' "$TSO_BOT_DEPLOY_KEY" > "$key_file"
            GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              git push "git@github.com:$GITHUB_REPOSITORY.git" HEAD:main
          fi

      - name: Upload weekly review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tactical-swing-os-weekly-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            reports/weekly/*.md
            reports/audit/*.md
            results/weekly_review.csv
            results/weekly_review.json
            results/latest_audit_status.txt
            data/weekly_review_log.csv
