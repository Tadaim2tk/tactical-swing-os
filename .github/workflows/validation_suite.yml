name: Tactical Swing OS validation suite

on:
  workflow_dispatch:
  schedule:
    # 03:30 UTC Sunday = 12:30 JST 日曜。週次の沈黙死検知網(pytest + YAML lint + 全レイヤー実行)
    - cron: "30 3 * * 0"

permissions:
  contents: read

jobs:
  validation-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # 監査T1 (2026-09-06): この workflow は「全テスト実行」を名乗っていたが、
      # 実際は下の24本のスクリプトを走らせるだけで pytest を1本も走らせていなかった。
      # 週次の沈黙死検知網を名乗る以上、まずテストを走らせる。
      - name: Run pytest (週次の沈黙死検知網の本体)
        run: python -m pytest -q

      - name: Run validation pipeline
        run: |
          python src/fetch_market.py
          python src/fetch_news.py --hours 24 --max-items 30 --timeout-seconds 5 --global-timeout-seconds 45 || echo "warning: news fetch failed; continuing validation"
          python src/classify_news_narratives.py || echo "warning: news classification failed; continuing validation"
          python src/build_narrative_memory.py
          python src/retrieve_similar_narratives.py
          python src/evaluate_narrative_similarity.py
          python src/evaluate_ablation.py
          python src/link_shadow_outcomes.py
          python src/score_prediction_log.py
          python src/reevaluate_pending_signals.py --lookback-days 30 --horizon 10
          python src/build_latest_evaluations.py
          python src/build_ai_feedback.py
          python src/build_weekly_review.py
          python src/build_monthly_calibration.py
          python src/analyze_reason_codes.py
          python src/propose_rule_updates.py
          python src/propose_model_state_updates.py
          python src/audit_model_state_proposals.py
          python src/build_weights_patch.py
          python src/review_weights_patch.py
          python src/track_proposal_adoption.py
          python src/build_weight_version_history.py
          python src/build_meta_learning.py
          python src/build_auto_calibration_candidates.py
          python src/build_human_override_analytics.py
          python src/build_portfolio_layer.py
          python src/audit_datetime_consistency.py
          python src/build_prediction_calibration.py
          python src/build_narrative_reliability.py
          python src/build_audit_report.py
          python src/audit_narrative_lookahead.py
          python src/shadow_weights.py
          python src/audit_adversarial_review.py
          python src/build_dashboard.py

      - name: Write validation summary
        run: |
          echo "## Tactical Swing OS Validation Summary" >> "$GITHUB_STEP_SUMMARY"

          check_file() {
            label="$1"
            path="$2"
            if [ -f "$path" ]; then
              echo "- ${label}: generated" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ${label}: warning missing ${path}" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          check_file "latest evaluations" "results/latest_evaluations.csv"
          check_file "AI feedback" "results/ai_feedback.json"
          check_file "weekly review" "results/weekly_review.json"
          check_file "monthly calibration" "results/monthly_calibration.json"
          check_file "reason code analysis" "results/reason_code_analysis.json"
          check_file "rule update proposals" "results/rule_update_proposals.json"
          check_file "model state update proposals" "results/model_state_update_proposals.json"
          check_file "model state proposal audit" "results/model_state_proposal_audit.json"
          check_file "weights patch proposal" "results/weights_patch_proposal.json"
          check_file "weights patch review" "results/weights_patch_review_summary.json"
          check_file "proposal adoption tracking" "results/proposal_adoption_tracking_summary.json"
          check_file "weight version history" "results/weight_version_history_summary.json"
          check_file "meta learning" "results/meta_learning_summary.json"
          check_file "auto calibration candidates" "results/auto_calibration_candidates_summary.json"
          check_file "human override analytics" "results/human_override_analytics_summary.json"
          check_file "portfolio layer" "results/portfolio_layer_summary.json"
          check_file "datetime audit" "results/datetime_audit_summary.json"
          check_file "prediction calibration" "results/prediction_calibration.json"
          check_file "narrative reliability" "results/narrative_reliability.json"
          check_file "transaction cost model" "config/cost_model.json"
          check_file "audit report status" "results/latest_audit_status.txt"
          check_file "narrative lookahead audit" "results/narrative_lookahead_audit_summary.json"
          check_file "adversarial review" "results/adversarial_review_summary.json"
          check_file "shadow weights" "results/shadow_weight_impact_summary.json"
          check_file "narrative memory" "results/narrative_memory_summary.json"
          check_file "similar narratives" "results/similar_narrative_summary.json"
          check_file "ablation comparison" "results/ablation_comparison_summary.json"
          check_file "prediction log scores" "results/prediction_log_score_summary.json"
          check_file "dashboard" "reports/dashboard/index.html"

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tactical-swing-os-validation-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            reports/**/*.md
            reports/model_state/*.md
            reports/dashboard/index.html
            reports/dashboard/dashboard_summary.json
            results/*.csv
            results/*.json
            results/model_state_update_proposals.csv
            results/model_state_update_proposals.json
            results/model_state_update_summary.json
            results/model_state_proposal_audit.csv
            results/model_state_proposal_audit.json
            results/weights_patch_proposal.csv
            results/weights_patch_proposal.json
            results/weights_patch_summary.json
            reports/model_state/*_weights_patch_proposal.md
            results/weights_patch_review.csv
            results/weights_patch_review.json
            results/weights_patch_review_summary.json
            reports/model_state/*_weights_patch_review.md
            results/proposal_adoption_tracking.csv
            results/proposal_adoption_tracking.json
            results/proposal_adoption_tracking_summary.json
            reports/model_state/*_proposal_adoption_tracking.md
            results/weight_version_history.csv
            results/weight_version_history.json
            results/weight_version_history_summary.json
            reports/model_state/*_weight_version_history.md
            results/meta_learning.csv
            results/meta_learning.json
            results/meta_learning_summary.json
            reports/model_state/*_meta_learning.md
            results/auto_calibration_candidates.csv
            results/auto_calibration_candidates.json
            results/auto_calibration_candidates_summary.json
            reports/model_state/*_auto_calibration_candidates.md
            results/human_override_analytics.csv
            results/human_override_analytics.json
            results/human_override_analytics_summary.json
            reports/model_state/*_human_override_analytics.md
            results/portfolio_layer.csv
            results/portfolio_layer.json
            results/portfolio_layer_summary.json
            reports/portfolio/*_portfolio_layer.md
            results/datetime_audit.csv
            results/datetime_audit.json
            results/datetime_audit_summary.json
            reports/system/*_datetime_audit.md
            results/prediction_calibration.csv
            results/prediction_calibration.json
            reports/calibration/*_prediction_calibration.md
            results/narrative_reliability.csv
            results/narrative_reliability.json
            reports/narrative/*_narrative_reliability.md
            results/latest_audit_status.txt
            reports/audit/*_audit_report.md
            results/narrative_lookahead_audit.csv
            results/narrative_lookahead_audit.json
            results/narrative_lookahead_audit_summary.json
            reports/narrative/*_narrative_lookahead_audit.md
            results/adversarial_review.csv
            results/adversarial_review.json
            results/adversarial_review_summary.json
            results/shadow_weight_impact_summary.json
            results/narrative_memory_summary.json
            results/similar_narrative_cases.csv
            results/narrative_similarity_evaluation.json
            results/ablation_comparison.csv
            results/ablation_comparison_summary.json
            results/shadow_weighted_signals.csv
            reports/audit/*_adversarial_review.md
