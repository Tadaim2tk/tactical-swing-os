name: Tactical Swing OS sheets maintenance

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true で実際に resize を適用 (既定はプレビューのみ)"
        required: false
        default: "false"
      repair_evaluations:
        description: "inspect / apply — EVALUATIONS 列爆発の検査/修復"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sheets-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Trim empty grid surplus (non-destructive resize only)
        if: inputs.repair_evaluations == ''
        run: python src/trim_sheets_grid.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TRIM_APPLY: ${{ inputs.apply }}

      - name: Repair EVALUATIONS column explosion
        if: inputs.repair_evaluations != ''
        run: python src/repair_evaluations_tab.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          REPAIR_APPLY: ${{ inputs.repair_evaluations == 'apply' && 'true' || 'false' }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: sheets-maintenance-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            results/sheets_maintenance_report.json
            results/evaluations_repair_report.json
