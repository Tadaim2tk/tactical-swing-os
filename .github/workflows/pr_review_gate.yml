name: Codex review gate

# レビュー到着前マージ事故(#115-#117, 2026-08-25: 作成13秒後にマージ、Codexレビューは
# 3分後着=指摘が「PRの修正」でなく「mainの負債」になった)の構造対策。
#
# 設計判断(2026-08-27改定): ruleset "main-merge-gate" がこのcheckをmainの必須チェックに
# しており、チェック完了前のマージはGitHub側で物理的に弾かれる(人側手順ルールから機構へ移管、
# governance_reform_2026-07 §6)。夜間ボットのmain直接pushは専用鍵の例外経路で両立(§6)。
#
# 成功条件は「レビュー到着」ではなく「未解決のCodex指摘スレッドがゼロ」(#121 Codex P1対応:
# 到着だけで緑にすると、--auto予約が指摘を読む前にマージしてしまう):
# - レビュー未着のままtimeout → 成功(fail-open: Codex停止で全マージを詰まらせない)。
#   ただし2026-09-06にこの経路で4本(#145/#148/#149/#150)が未レビューのままマージされた。
#   同じ緑が「レビュー済み・指摘なし」と「未レビュー」の2つを意味してしまうため、
#   fail-openで通した場合はPRにコメントを残して区別できるようにした。
# - レビュー到着済みで未解決スレッドが残ったままtimeout → 失敗(赤)。修正をpushするか
#   スレッドをresolveすれば、synchronize/再実行で緑になる。

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  # fail-open で通したことを PR にコメントで残すため write が要る(2026-09-06)。
  # 読み取りだけだと「緑の意味」が Actions のログにしか残らず、PRを見た人には見えない。
  pull-requests: write

jobs:
  wait-for-codex-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for Codex review with zero unresolved findings (max 20 min)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          owner="${REPO%%/*}"
          name="${REPO##*/}"
          arrived=0
          for i in $(seq 1 40); do
            # レビューは現在のhead SHAに対するものだけを数える(Codex P1対応:
            # synchronize時に旧コミットへの古いレビューで即グリーンになるのを防ぐ)。
            n=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
              --jq "[.[] | select(.user.login==\"chatgpt-codex-connector[bot]\" and .commit_id==\"$HEAD_SHA\")] | length" \
              2>/dev/null | awk '{s+=$1} END {print s+0}')
            if [ "$n" -gt 0 ]; then
              arrived=1
              # 未解決のCodex指摘スレッド数。コミットを跨いで数える(古い未処理指摘も塞ぐ)。
              # GraphQL失敗時は unknown のまま待ち続け、最終的に赤に倒す(安全側)。
              unresolved=$(gh api graphql \
                -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved comments(first:1){nodes{author{login}}}}}}}}' \
                -f owner="$owner" -f name="$name" -F number="$PR" \
                --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved|not) | select((.comments.nodes[0].author.login // "") | startswith("chatgpt-codex-connector"))] | length' \
                2>/dev/null || echo "unknown")
              if [ "$unresolved" = "0" ]; then
                echo "Codex review arrived ($n review(s)) and no unresolved finding threads remain."
                echo "### ゲート: Codexレビュー済み・未解決指摘なし ($n review(s))" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "Codex review arrived; unresolved finding threads: $unresolved — address them in this PR. ($i/40)"
            else
              # Codexが「レビュー枠を使い切った」とコメントしている場合、待っても永久に来ない
              # (2026-09-06に実際に発生: 一晩で10本出して枠が尽き、6本が未レビューでマージ)。
              # レビュー本体ではなく issue comment として来るため reviews API では見えない。
              # 20分待ってから開けるのではなく、理由を明示して即座に開ける。
              quota=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
                --jq '[.[] | select((.user.login // "") | startswith("chatgpt-codex-connector")) | select(.body | test("usage limits for code reviews"))] | length' \
                2>/dev/null | awk '{s+=$1} END {print s+0}')
              if [ "${quota:-0}" -gt 0 ]; then
                echo "Codex has run out of code-review quota — gate passes without review."
                {
                  echo "### ゲート: **Codexのレビュー枠切れのまま通過(fail-open)**"
                  echo ""
                  echo "Codexが利用上限に達しており、待っても来ない。理由を明示して即座に通した。"
                  echo "この緑は「レビュー済み・指摘なし」を意味しない。"
                } >> "$GITHUB_STEP_SUMMARY"
                gh pr comment "$PR" --repo "$REPO" --body \
                  "🔴 **Codexのレビュー枠切れのまま通過しました(fail-open)**。Codexが「usage limits for code reviews」に達しており、待ってもレビューは来ません。この緑は「レビュー済み・指摘なし」ではありません。**枠が回復するまで、全てのPRが未レビューでマージされます。** 評価・選別の定義に触るPRを出す前に、枠の回復か追加クレジットを確認してください。" \
                  || echo "warning: could not post the quota notice comment"
                exit 0
              fi
              echo "waiting for Codex review... ($i/40)"
            fi
            sleep 30
          done
          if [ "$arrived" -gt 0 ]; then
            echo "::error::Codex findings are still unresolved after 20 min. Push a fix and/or resolve the threads, then re-run this check."
            exit 1
          fi
          # 2026-09-06: この経路で #145/#148/#149/#150 の4本が「未レビューのまま」マージされた。
          # check の結果は success なので、緑を見ただけでは「レビュー済み・指摘なし」と
          # 区別がつかない。**同じ緑が2つの意味を持つ**のは監査T1と同じ構図なので、
          # fail-open で通したことを PR 本体に痕跡として残す。
          echo "No Codex review within 20 min — gate passes as a no-review PR."
          {
            echo "### ゲート: **Codexレビュー未着のまま通過(fail-open)**"
            echo ""
            echo "20分待ってレビューが来なかったため、no-review PR として通した。"
            echo "この緑は「レビュー済み・指摘なし」を意味しない。"
          } >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --repo "$REPO" --body \
            "🟡 **Codexレビュー未着のまま通過しました(fail-open)**。ゲートは20分待って無反応だったため no-review PR として通しています。この緑は「レビュー済み・指摘なし」ではありません。評価・選別の定義に触るPRなら、後追いでレビューを依頼してください。" \
            || echo "warning: could not post the fail-open notice comment"
