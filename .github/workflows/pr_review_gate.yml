name: Codex review gate

# レビュー到着前マージ事故(#115-#117, 2026-08-25: 作成13秒後にマージ、Codexレビューは
# 3分後着=指摘が「PRの修正」でなく「mainの負債」になった)の構造対策。
#
# 設計判断(2026-08-27改定): ruleset "main-merge-gate" がこのcheckをmainの必須チェックに
# しており、チェック完了前のマージはGitHub側で物理的に弾かれる(人側手順ルールから機構へ移管、
# governance_reform_2026-07 §6)。日次CIボットのmain直接pushはDeploy key認証に切替えて
# bypass指定済みのため、夜間パイプラインは止まらない。fail-open(20分timeoutで成功)は維持:
# Codex停止時にマージ不能で詰まらせないため。

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read

jobs:
  wait-for-codex-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for Codex review (arrival = green early, max 20 min)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # chatgpt-codex-connector[bot] のレビューが届いたら即成功。
          # 20分待っても届かなければ「レビューなしPR」として成功にする
          # (Codex側の停止で全マージが詰まるのを防ぐ。締め切りは緩く、既定は待つ)。
          # レビューは現在のhead SHAに対するものだけを数える(Codex P1指摘への対応:
          # synchronize時に旧コミットへの古いレビューで即グリーンになるのを防ぐ。
          # Codexが更新コミットを再レビューしない場合はタイムアウト通過となる)。
          for i in $(seq 1 40); do
            n=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
              --jq "[.[] | select(.user.login==\"chatgpt-codex-connector[bot]\" and .commit_id==\"$HEAD_SHA\")] | length" \
              2>/dev/null | awk '{s+=$1} END {print s+0}')
            if [ "$n" -gt 0 ]; then
              echo "Codex review arrived: $n review(s). Read it before merging."
              exit 0
            fi
            echo "waiting for Codex review... ($i/40)"
            sleep 30
          done
          echo "No Codex review within 20 min — gate passes as a no-review PR."
