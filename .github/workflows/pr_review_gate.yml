name: Codex review gate

# レビュー到着前マージ事故(#115-#117, 2026-08-25: 作成13秒後にマージ、Codexレビューは
# 3分後着=指摘が「PRの修正」でなく「mainの負債」になった)の構造対策。
#
# 設計判断(2026-08-27改定): ruleset "main-merge-gate" がこのcheckをmainの必須チェックに
# しており、チェック完了前のマージはGitHub側で物理的に弾かれる(人側手順ルールから機構へ移管、
# governance_reform_2026-07 §6)。夜間ボットのmain直接pushは専用鍵の例外経路で両立(§6)。
#
# 成功条件は「レビュー到着」ではなく「未解決のCodex指摘スレッドがゼロ」(#121 Codex P1対応:
# 到着だけで緑にすると、--auto予約が指摘を読む前にマージしてしまう):
# - レビュー未着のままtimeout → 成功(fail-open: Codex停止で全マージを詰まらせない)。
#   ただし2026-09-06にこの経路で4本(#145/#148/#149/#150)が未レビューのままマージされた。
#   同じ緑が「レビュー済み・指摘なし」と「未レビュー」の2つを意味してしまうため、
#   fail-openで通した場合はPRにコメントを残して区別できるようにした。
# - レビュー到着済みで未解決スレッドが残ったままtimeout → 失敗(赤)。修正をpushするか
#   スレッドをresolveすれば、synchronize/再実行で緑になる。
#
# 2026-09-09改定(#162): **reviews API しか見ていなかったため、指摘を見落として緑にした。**
# Codexは 23:26Z にP2指摘を出したのに、ゲートは 23:41Z に「未着(fail-open)」と書き、
# 1分後にマージされた。指摘は **issue comment** で来るので reviews API には現れない。
# 判定は tools/codex_review_state.py に出した。6状態を区別し、**読み取れないものは
# 緑にしない**。通信に触らない純粋関数なので、架空データで試験できる
# (src/test_codex_review_state.py)。
#
# **導入回の扱い**: 判定器は base の版を使う(PRの版だとゲート自身を書き換えて
# 自分を通せる)。だから **この仕組みを入れるPR自身では、base に判定器が無い。**
# そのときは緑にも赤の自動通過にもせず、**赤で止めて GATE-ACK を要求する。**
# PR側のコードを信じて動かすことはしない。

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  # fail-open で通したことを PR にコメントで残すため write が要る(2026-09-06)。
  # 読み取りだけだと「緑の意味」が Actions のログにしか残らず、PRを見た人には見えない。
  pull-requests: write

jobs:
  wait-for-codex-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # 判定器は **baseの版** を使う。PRの版を使うと、ゲート自身を書き換えて
      # 自分を通せてしまう。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Wait for Codex review with zero unresolved findings (max 20 min)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          owner="${REPO%%/*}"
          name="${REPO##*/}"

          fetch_comments() {
            if ! gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[]' 2>/dev/null \
                 | jq -s '.' > comments.json; then
              echo '[]' > comments.json
            fi
          }

          # 承認できるのは誰か。**author_association は書き込み権限ではない。**
          # 判定は tools/resolve_gate_ack.sh に出した。**標準出力は login だけ**で、
          # 診断は標準エラーへ出る。初版はワークフロー内の関数で、権限が無いときの
          # 説明文を標準出力へ出していたため、**その説明が承認として通っていた。**
          resolve_ack() {
            bash tools/resolve_gate_ack.sh comments.json "$REPO" "$HEAD_SHA"
          }

          # --- 導入回: base に判定器がまだ無い ---
          # **PR側のコードは動かさない。** ゲート自身を書き換えて自分を通せてしまう。
          if [ ! -f tools/codex_review_state.py ] || [ ! -f tools/resolve_gate_ack.sh ]; then
            if [ -f tools/resolve_gate_ack.sh ]; then
              fetch_comments
              if [ -n "$(resolve_ack)" ]; then
                {
                  echo "### ゲート: **人の承認で通過(GATE-ACK / 判定器の導入回)**"
                  echo ""
                  echo "base にまだ判定器が無いため自動判定できない。書き込み権限を確認した人の承認で通した。"
                } >> "$GITHUB_STEP_SUMMARY"
                gh pr comment "$PR" --repo "$REPO" --body \
                  "🟠 **人の承認で通過しました(GATE-ACK / 判定器の導入回)**。base に \`tools/codex_review_state.py\` がまだ無く、**PR側のコードは信用しない**方針のため自動判定できません。書き込み権限を確認した人の承認で通しています。この緑は「Codexレビュー済み・指摘なし」ではありません。" \
                  || echo "warning: could not post the bootstrap ack comment"
                exit 0
              fi
              echo "::error::base に tools/codex_review_state.py が無い(判定器の導入回)。**PR側のコードは動かさない。** 内容とレビューを人が確認したうえで、PR に GATE-ACK: $HEAD_SHA とコメントして再実行すること。"
              exit 1
            fi
            # この仕組みを入れる最初のPRでは、承認スクリプトも base に無い。
            # **ゲートを緑にする経路は無い。** 誤魔化さずに赤で止める。
            echo "::error::base に判定器も承認スクリプトも無い(この仕組みを入れる最初のPR)。**ゲートが緑になる経路は無い。** 差分とレビューを人が確認したうえで、管理者権限でこの必須チェックをバイパスして入れること。次回以降は base に判定器が入るので、この経路は通らない。"
            exit 1
          fi

          last="pending"
          for i in $(seq 1 40); do
            # (1) レビュー本体。いまのhead SHAに対するものだけ数える。
            reviews=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
              --jq "[.[] | select(.user.login==\"chatgpt-codex-connector[bot]\" and .commit_id==\"$HEAD_SHA\")] | length" \
              2>/dev/null | awk '{s+=$1} END {print s+0}')
            # (2) 未解決の指摘スレッド。数えられなければ unknown を渡す(判定器が赤に倒す)。
            unresolved=$(gh api graphql \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved comments(first:1){nodes{author{login}}}}}}}}' \
              -f owner="$owner" -f name="$name" -F number="$PR" \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved|not) | select((.comments.nodes[0].author.login // "") | startswith("chatgpt-codex-connector"))] | length' \
              2>/dev/null || echo "unknown")
            [ -n "$unresolved" ] || unresolved="unknown"
            # (3) issue comment。**指摘はここに来る。**
            fetch_comments

            out=$(python3 tools/codex_review_state.py --head "$HEAD_SHA" \
                    --comments comments.json --reviews "$reviews" \
                    --unresolved "$unresolved" --ack-logins "$(resolve_ack)")
            state=$(printf '%s\n' "$out" | sed -n 1p)
            why=$(printf '%s\n' "$out" | sed -n 2p)
            echo "[$i/40] $state — $why"

            case "$state" in
              clean)
                echo "### ゲート: Codexレビュー済み・未解決指摘なし" >> "$GITHUB_STEP_SUMMARY"
                echo "$why" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              acked)
                # **人が飲み込んだ緑。「レビュー問題なし」と同じ印にしない。**
                {
                  echo "### ゲート: **人の承認で通過(GATE-ACK)**"
                  echo ""
                  echo "$why"
                } >> "$GITHUB_STEP_SUMMARY"
                gh pr comment "$PR" --repo "$REPO" --body \
                  "🟠 **人の承認で通過しました(GATE-ACK)**。書き込み権限を確認した人が \`GATE-ACK: $HEAD_SHA\` と書いたため通しています。この緑は「Codexレビュー済み・指摘なし」ではありません。**指摘を承知のうえで通した**という記録です。" \
                  || echo "warning: could not post the ack notice comment"
                exit 0
                ;;
              quota)
                {
                  echo "### ゲート: **Codexのレビュー枠切れのまま通過(fail-open)**"
                  echo ""
                  echo "Codexが利用上限に達しており、待っても来ない。理由を明示して即座に通した。"
                  echo "この緑は「レビュー済み・指摘なし」を意味しない。"
                } >> "$GITHUB_STEP_SUMMARY"
                gh pr comment "$PR" --repo "$REPO" --body \
                  "🔴 **Codexのレビュー枠切れのまま通過しました(fail-open)**。Codexが「usage limits for code reviews」に達しており、待ってもレビューは来ません。この緑は「レビュー済み・指摘なし」ではありません。**枠が回復するまで、全てのPRが未レビューでマージされます。** 評価・選別の定義に触るPRを出す前に、枠の回復か追加クレジットを確認してください。" \
                  || echo "warning: could not post the quota notice comment"
                exit 0
                ;;
              findings|undecidable)
                last="$state"
                ;;
              *)
                ;;
            esac
            sleep 30
          done

          if [ "$last" = "findings" ]; then
            echo "::error::Codexの指摘がこのコミットに残っている。修正をpushするか、スレッドをresolveしてから再実行すること。"
            exit 1
          fi
          if [ "$last" = "undecidable" ]; then
            echo "::error::Codexレビューは来たが結論を読み取れない。**読み取れないものを緑にしない。** 指摘を確認したうえで通すなら、書き込み権限のある人が PR に GATE-ACK: $HEAD_SHA とコメントして再実行すること。"
            exit 1
          fi
          # 2026-09-06: この経路で #145/#148/#149/#150 の4本が「未レビューのまま」マージされた。
          # check の結果は success なので、緑を見ただけでは「レビュー済み・指摘なし」と
          # 区別がつかない。**同じ緑が2つの意味を持つ**のは監査T1と同じ構図なので、
          # fail-open で通したことを PR 本体に痕跡として残す。
          echo "No Codex review within 20 min — gate passes as a no-review PR."
          {
            echo "### ゲート: **Codexレビュー未着のまま通過(fail-open)**"
            echo ""
            echo "20分待ってレビューが来なかったため、no-review PR として通した。"
            echo "この緑は「レビュー済み・指摘なし」を意味しない。"
          } >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --repo "$REPO" --body \
            "🟡 **Codexレビュー未着のまま通過しました(fail-open)**。ゲートは20分待って無反応だったため no-review PR として通しています。この緑は「レビュー済み・指摘なし」ではありません。評価・選別の定義に触るPRなら、後追いでレビューを依頼してください。" \
            || echo "warning: could not post the fail-open notice comment"
