name: Codex review gate

# レビュー到着前マージ事故(#115-#117, 2026-08-25: 作成13秒後にマージ、Codexレビューは
# 3分後着=指摘が「PRの修正」でなく「mainの負債」になった)の構造対策。
#
# 設計判断(2026-08-27改定): ruleset "main-merge-gate" がこのcheckをmainの必須チェックに
# しており、チェック完了前のマージはGitHub側で物理的に弾かれる(人側手順ルールから機構へ移管、
# governance_reform_2026-07 §6)。夜間ボットのmain直接pushは専用鍵の例外経路で両立(§6)。
#
# 成功条件は「レビュー到着」ではなく「未解決のCodex指摘スレッドがゼロ」(#121 Codex P1対応:
# 到着だけで緑にすると、--auto予約が指摘を読む前にマージしてしまう):
# - レビュー未着のままtimeout → 成功(fail-open: Codex停止で全マージを詰まらせない)。
#   ただし2026-09-06にこの経路で4本(#145/#148/#149/#150)が未レビューのままマージされた。
#   同じ緑が「レビュー済み・指摘なし」と「未レビュー」の2つを意味してしまうため、
#   fail-openで通した場合はPRにコメントを残して区別できるようにした。
# - レビュー到着済みで未解決スレッドが残ったままtimeout → 失敗(赤)。修正をpushするか
#   スレッドをresolveすれば、synchronize/再実行で緑になる。
#
# 2026-11-24 改定: 「指摘なし」のレビューを、レビュー未着と取り違えていた。
# Codex は指摘が無いときレビューを作らない。要約コメントを「completed・指摘なし」に書き換えて 👍 を付けるだけで、
# reviews API には何も出ない。ゲートは reviews API しか見ていなかったので、Codex が2分で読み終えた PR を20分待ち、
# 「レビュー未着のまま通過(fail-open)」と書いていた。通知を入れた 2026-09-06 から 11-24 までにマージされた
# 73本（#152〜#229）のうち 68本にこの黄色が付いた。要約の状態が残っている範囲で数えると、33本（#184〜#228 の
# うち）は実際はレビュー済み・指摘なし、10本は本当に最後のコミットが未レビューだった（残りは古い書式で判別できない）。
# **同じ黄色が「未レビュー」と「レビュー済み」の両方に付いていた**ので、黄色を見ても何も分からなかった。
# （初版のこの註と PR #229 は「12本」と書いたが数え間違い。#217〜#228 でマージ済みなのは 11本。）
# - 要約コメントの機械可読な状態（`codex-review-state:v1` の JSON）が、**いまの head** について
#   completed・指摘なしと言っていれば、レビュー到着として扱う（未解決スレッドの確認は同じように行う）。
# - 要約が「いまの head に指摘あり」と言っているのにレビュー（指摘スレッド）が見えないまま timeout → 失敗(赤)。
#   指摘があると分かっている PR を fail-open で通さない（#162 で起きた形）。
# - 要約が読めない・別のコミットを指している・実行中のまま → 従来どおり待ち、timeout で fail-open（黄色）。
#   読めないものを「レビュー済み」にはしない。
#
# 2026-11-24 改定(2): push されたあとの head が未レビューのまま通るとき、そう書く。古い実行は畳む。
# Codex が動くのは「PR を開いた」「draft を外した」「レビュー依頼のコメントが書かれた」の3つだけで、push では動かない。
# 待つだけだと、指摘を直して push した head は誰にも読まれず、20分後に fail-open で通る。上の「本当に未レビュー
# だった10本」のうち8本がこの形だった（#188・#189・#200・#201・#202・#204・#206・#210。残り2本はレビューが
# 20分で終わらなかった）。
# - **ゲートが自分で依頼を書く方式は、働かない。** PR #230 で実際に試した: ゲート（github-actions[bot]）が依頼の
#   コメントを書くと、Codex は「Codex のアカウントを作って GitHub に接続してください」と返すだけで、読まない。
#   依頼は Codex に接続した人のアカウントからでないと通らない。だからこの手順は入れていない。
#   ERS の ERS-ADR-0082（2026-09-07）は同じ方式だが、ERS の PR #82 でも Codex は8回とも同じ返事をしている
#   （初版は「4回」と書いたが、一覧が途中で切れていた数字。2026-11-25 に全件を数え直した）。
# - 時間切れで通すときの通知を、理由ごとに分ける（fail-open の方針は変えていない。どれも通す）。
#   (a) push された head で、push のあとに人の依頼が無く、Codex が読み始めた跡も無い
#       → 「🟠 push されたあとの head を、誰もレビューに出していません」
#   (b) Codex がいまの head を読み始めたが、20分で終わらなかった → 「🟡 レビュー未着…読み始めたが終わらなかった」
#   (c) それ以外（PR を開いた・draft を外した・人が頼んだ。Codex が動くはずなのに無反応） → 従来の「🟡 レビュー未着」
#   依頼の有無を読めなかったときは (a) にしない（「誰も頼んでいない」と言い切れないので (c)）。
# - 同じ PR の古い実行は畳む（concurrency）。古い head を待ち続けて、あとから通知を書くのを防ぐ。
# - 判定はこのファイルの中だけにある。2026-09 に書いた別の判定器（tools/codex_review_state.py）と承認スクリプト
#   （tools/resolve_gate_ack.sh）は、一度もこのゲートにつながれないまま main に残っていたので、2026-11-24 に外した。
#
# 2026-11-25 改定: Codex が同じ head を読み直している最中は、前の回のレビューで先に通さない。
# 同じ head に前の回のレビュー（指摘は解決済み）が残っていると、読み直しを頼んだ直後でも「レビュー到着・未解決ゼロ」で
# その場で通っていた。--auto の予約があればそこでマージされ、読み直しの結果はマージの後に届く（このゲートが防ぐために
# 在る #115-#117 の形）。ERS の同型のゲートを直したとき（ERS の PR 92）に Codex が指摘した穴で、こちらにも残っていた。
# - 要約が「いまの head を読んでいる最中」と言うあいだは通さない。読めなかった周回では、最後に読めた内容に従う
#   （読めなかったことを「読み終えた」と読まない）。
# - そのあいだも未解決スレッドは数えて覚えておく。時間切れのとき、最後に数えた結果が未解決（または数えられなかった）
#   なら赤。未解決ゼロのまま読み直しが終わらなければ、(b) の通知つきで通す（Codex 側の停止。方針は変えていない）。
# - 入れていないもの: 要約が先に「指摘あり」へ変わり、新しい指摘スレッドが遅れて見える順番への備え。ERS の PR 92 で
#   見た3回は、どれも結果（レビュー）が先で、要約の書き換えが2〜3秒あとだった。その順番ならこの改定で足りる。

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  # fail-open で通したことを PR にコメントで残すため write が要る(2026-09-06)。
  # 読み取りだけだと「緑の意味」が Actions のログにしか残らず、PRを見た人には見えない。
  pull-requests: write

# 続けて push すると、同じ PR の実行が重なる。古い方は自分の head へのレビューを待ち続けるが、Codex が読むのは
# 常に最新の head なので、その待ちは満たされない。20分後に、古い head について黄色い通知を書くだけになる。
# PR ごとに1本に絞り、古い方は畳む。必須チェックが見るのは最新の head の実行。
concurrency:
  group: codex-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wait-for-codex-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # issue comments（配列の並び）を読み、Codex の要約コメントが **いまの head** について何と言っているかを
      # 1語で返す: clean（completed・指摘なし）/ findings（completed・指摘あり）/ running（まだ）/ none（要約が無い・
      # 読めない・別のコミット）。投稿者は Codex の Bot に限る。JSON が壊れていれば none（緑にしない）。
      # 試験は src/test_pr_review_gate_workflow.py がこの文字列をそのまま jq に渡して行う。
      SUMMARY_FILTER: |
        add // []
        | [ .[]
            | select((.user.login // "") == "chatgpt-codex-connector[bot]" and (.user.type // "") == "Bot")
            | (.body // "")
            | select(contains("codex-pull-request-review-summary"))
            | capture("codex-review-state:v1 (?<j>\\{.*\\}) -->")
            | (.j | try fromjson catch null)
            | select(type == "object")
            | .code_review
            | select(type == "object" and .commit_sha == $head)
          ] as $s
        | if ($s | length) == 0 then "none"
          elif any($s[]; .status == "completed" and .has_any_findings == true) then "findings"
          elif any($s[]; .status == "completed" and .has_any_findings == false) then "clean"
          else "running" end
    steps:
      - name: Wait for Codex review with zero unresolved findings (max 20 min)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          # push の時刻（synchronize のとき PR の updated_at がそれに当たる）。これより後に人が書いた依頼を数える。
          PUSHED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          owner="${REPO%%/*}"
          name="${REPO##*/}"
          arrived=0
          summary_findings=0
          summary_running=0
          # 最後に読めた要約が「いまの head を読んでいる最中」だった（読めなかった周回では前の値を持ち越す）。
          rereading=0
          # 最後に未解決スレッドを数えたとき、残っていた（または数えられなかった）。
          open_findings=0
          echo "event=${EVENT_ACTION:-} head=$HEAD_SHA pushed_at=${PUSHED_AT:-}"
          for i in $(seq 1 40); do
            # レビューは現在のhead SHAに対するものだけを数える(Codex P1対応:
            # synchronize時に旧コミットへの古いレビューで即グリーンになるのを防ぐ)。
            n=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
              --jq "[.[] | select(.user.login==\"chatgpt-codex-connector[bot]\" and .commit_id==\"$HEAD_SHA\")] | length" \
              2>/dev/null | awk '{s+=$1} END {print s+0}')
            # 指摘が無いとき Codex はレビューを作らず、要約コメントだけを更新する。そちらも読む。
            summary_state=$( (gh api --paginate "repos/$REPO/issues/$PR/comments" 2>/dev/null \
              | jq -rs --arg head "$HEAD_SHA" "$SUMMARY_FILTER" 2>/dev/null) || true)
            case "$summary_state" in clean|findings|running) ;; *) summary_state="none" ;; esac
            # 一度でも「いまの head に指摘あり」を見たら、その後の周回で読めなくなっても忘れない（#229 Codex P2）。
            # 毎周 0 に戻していた初版は、最後の周だけコメントの取得に失敗すると、指摘を見たあとなのに
            # 「レビュー未着」で通していた。取り消せるのは、指摘なしを確かめて通る場合（下で exit 0）だけ。
            if [ "$summary_state" = "findings" ]; then
              summary_findings=1
            fi
            # Codex がいまの head を読み始めた跡。時間切れのとき「誰も頼んでいない」と書かないために覚えておく。
            if [ "$summary_state" = "running" ]; then
              summary_running=1
            fi
            # Codex がいまの head を読んでいる最中かどうか。要約がこの head について結論（指摘なし・指摘あり）を
            # 言ったら 0 に戻す。**読めなかった周回（none）では変えない。** 読めなかったことを「読み終えた」と
            # 読むと、取得が1回失敗しただけで、下の「前の回のレビューで先に通さない」が外れる。
            case "$summary_state" in
              running) rereading=1 ;;
              clean|findings) rereading=0 ;;
            esac
            if [ "$n" -gt 0 ] || [ "$summary_state" = "clean" ]; then
              arrived=1
              # 未解決のCodex指摘スレッド数。コミットを跨いで数える(古い未処理指摘も塞ぐ)。
              # GraphQL失敗時は unknown のまま待ち続け、最終的に赤に倒す(安全側)。
              # 読み直しの最中でも数えて覚えておく（数えるのまでやめると、未解決が残ったまま読み直しが
              # 終わらなかったときに (b) の fail-open で通ってしまう）。
              unresolved=$(gh api graphql \
                -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved comments(first:1){nodes{author{login}}}}}}}}' \
                -f owner="$owner" -f name="$name" -F number="$PR" \
                --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved|not) | select((.comments.nodes[0].author.login // "") | startswith("chatgpt-codex-connector"))] | length' \
                2>/dev/null || echo "unknown")
              if [ "$unresolved" != "0" ]; then
                open_findings=1
                echo "Codex review arrived; unresolved finding threads: $unresolved — address them in this PR. ($i/40)"
              elif [ "$rereading" -gt 0 ]; then
                # **Codex はいまこの head を読み直している。** 同じ head への前の回のレビュー（指摘は解決済み）で
                # 先に通さない。先に通すと、--auto の予約がここでマージし、読み直しの結果はマージの後に届く。
                # 読み終われば、次の周回で結論（指摘なしなら通る・指摘ありなら未解決スレッドを待つ）に進む。
                open_findings=0
                echo "Codex is reviewing this head again; the earlier review has no unresolved threads, but the gate waits for the new result. ($i/40)"
              else
                if [ "$n" -gt 0 ]; then
                  echo "Codex review arrived ($n review(s)) and no unresolved finding threads remain."
                  echo "### ゲート: Codexレビュー済み・未解決指摘なし ($n review(s))" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "Codex reviewed this head and reported no findings (summary comment); no unresolved finding threads remain."
                  echo "### ゲート: Codexレビュー済み・指摘なし（要約コメントが、いまの head を completed・指摘なしと報告）" >> "$GITHUB_STEP_SUMMARY"
                fi
                exit 0
              fi
            elif [ "$summary_state" = "findings" ]; then
              # 要約は「いまの head に指摘あり」と言っているが、レビュー（指摘スレッド）がまだ見えない。
              # 数十秒遅れて届くことがあるので待つ。最後まで見えなければ赤にする（fail-open で通さない）。
              echo "Codex summary reports findings for this head, but no review is visible yet. ($i/40)"
            elif [ "$summary_findings" -gt 0 ] || [ "$arrived" -gt 0 ]; then
              # 前の周では、いまの head へのレビュー（または指摘ありの要約）が読めていた。今回は読めない
              # （取得の失敗か、読み直しの途中）。枠切れの通知で通す道にも入らない。
              # **一度レビューを見たあとで fail-open にしない。**
              echo "Codex reviewed this head earlier in this run; it cannot be read now. Still waiting. ($i/40)"
            else
              # Codexが「レビュー枠を使い切った」とコメントしている場合、待っても永久に来ない
              # (2026-09-06に実際に発生: 一晩で10本出して枠が尽き、6本が未レビューでマージ)。
              # レビュー本体ではなく issue comment として来るため reviews API では見えない。
              # 20分待ってから開けるのではなく、理由を明示して即座に開ける。
              quota=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
                --jq '[.[] | select((.user.login // "") | startswith("chatgpt-codex-connector")) | select(.body | test("usage limits for code reviews"))] | length' \
                2>/dev/null | awk '{s+=$1} END {print s+0}')
              if [ "${quota:-0}" -gt 0 ]; then
                echo "Codex has run out of code-review quota — gate passes without review."
                {
                  echo "### ゲート: **Codexのレビュー枠切れのまま通過(fail-open)**"
                  echo ""
                  echo "Codexが利用上限に達しており、待っても来ない。理由を明示して即座に通した。"
                  echo "この緑は「レビュー済み・指摘なし」を意味しない。"
                } >> "$GITHUB_STEP_SUMMARY"
                gh pr comment "$PR" --repo "$REPO" --body \
                  "🔴 **Codexのレビュー枠切れのまま通過しました(fail-open)**。Codexが「usage limits for code reviews」に達しており、待ってもレビューは来ません。この緑は「レビュー済み・指摘なし」ではありません。**枠が回復するまで、全てのPRが未レビューでマージされます。** 評価・選別の定義に触るPRを出す前に、枠の回復か追加クレジットを確認してください。" \
                  || echo "warning: could not post the quota notice comment"
                exit 0
              fi
              echo "waiting for Codex review... ($i/40)"
            fi
            sleep 30
          done
          # 最後に数えたとき未解決が残っていた（または数えられなかった）なら赤。「レビューを見たかどうか」（arrived）
          # ではなく、数えた結果で決める。読み直しの最中は未解決ゼロでも通さずに待つので、レビューを見たことと
          # 未解決が残っていることは、もう同じではない。
          if [ "$open_findings" -gt 0 ]; then
            echo "::error::Codex findings are still unresolved after 20 min. Push a fix and/or resolve the threads, then re-run this check."
            exit 1
          fi
          if [ "$summary_findings" -gt 0 ]; then
            echo "::error::Codex の要約コメントは、いまの head に指摘があると報告しているが、レビュー（指摘スレッド）を確認できない。PR の Codex のコメントを読み、修正を push するか、指摘が届いてから再実行する。"
            exit 1
          fi
          # ここから先は、いまの head を誰も読み終えていないまま通す道（fail-open。方針は変えていない）。
          # 同じ通過でも理由が違えば打つ手が違うので、通知を分ける。
          if [ "$summary_running" -gt 0 ]; then
            # (b) Codex はいまの head を読み始めたが、20分で終わらなかった（#190・#191 の形）。
            echo "Codex started reviewing this head but did not finish within 20 min — gate passes as a no-review PR."
            {
              echo "### ゲート: **Codexレビュー未着のまま通過(fail-open)** — 読み始めたが20分で終わらなかった"
              echo ""
              echo "Codex はこの head (${HEAD_SHA:0:7}) のレビューを始めたが、20分待っても結果が出なかった。"
              echo "この緑は「レビュー済み・指摘なし」を意味しない。"
            } >> "$GITHUB_STEP_SUMMARY"
            gh pr comment "$PR" --repo "$REPO" --body \
              "🟡 **Codexレビュー未着のまま通過しました(fail-open)**。Codex はこの head (${HEAD_SHA:0:7}) を読み始めましたが、20分待っても結果が出ませんでした。この緑は「レビュー済み・指摘なし」ではありません。あとから指摘が付くことがあるので、PR の Codex のコメントを確認してください。" \
              || echo "warning: could not post the unfinished-review notice comment"
            exit 0
          fi
          if [ "${EVENT_ACTION:-}" = "synchronize" ]; then
            # (a) push された head。Codex は push では動かないので、push のあとに人が依頼を書いたかを見る。
            # 依頼を読めなかったとき（取得の失敗）は「誰も頼んでいない」と言い切れないので、(c) に回す。
            requested="unknown"
            if comments_json=$(gh api --paginate "repos/$REPO/issues/$PR/comments" 2>/dev/null) && [ -n "$comments_json" ]; then
              requested=$(printf '%s' "$comments_json" \
                | jq -rs --arg since "${PUSHED_AT:-}" 'add // [] | [ .[] | select((.user.type // "") == "User") | select((.body // "") | test("^\\s*@codex\\s+review"; "i")) | select((.created_at // "") >= $since) ] | length' 2>/dev/null) || requested="unknown"
            fi
            if [ "$requested" = "0" ]; then
              echo "No one asked Codex to review this pushed head — gate passes as an unreviewed head."
              {
                echo "### ゲート: **push されたあとの head が、誰にもレビューに出されないまま通過(fail-open)**"
                echo ""
                echo "Codex は push では動かない。この head (${HEAD_SHA:0:7}) は、push (${PUSHED_AT:-時刻不明}) のあと誰も依頼していないので、読まれていない。"
                echo "この緑は「レビュー済み・指摘なし」を意味しない。"
              } >> "$GITHUB_STEP_SUMMARY"
              gh pr comment "$PR" --repo "$REPO" --body \
                "🟠 **push されたあとの head (${HEAD_SHA:0:7}) を、誰もレビューに出していません（未レビューのまま通過）**。Codex が読むのは、PR を開いたとき・draft を外したとき・レビュー依頼のコメントが書かれたときだけで、push では動きません。push (${PUSHED_AT:-時刻不明}) より後に人が書いた依頼は 0 件で、この head は誰にも読まれていません。評価・選別の定義やコードに触る変更なら、後追いでレビューを依頼してください（依頼のコメントは、Codex に接続した人のアカウントから書きます）。" \
                || echo "warning: could not post the unreviewed-push notice comment"
              exit 0
            fi
            echo "review requests by people since the push: $requested"
          fi
          # (c) Codex が動くはずの場面（PR を開いた・draft を外した・人が頼んだ）で、20分たっても何も来なかった。
          # 2026-09-06: この経路で #145/#148/#149/#150 の4本が「未レビューのまま」マージされた。
          # check の結果は success なので、緑を見ただけでは「レビュー済み・指摘なし」と
          # 区別がつかない。**同じ緑が2つの意味を持つ**のは監査T1と同じ構図なので、
          # fail-open で通したことを PR 本体に痕跡として残す。
          echo "No Codex review within 20 min — gate passes as a no-review PR."
          {
            echo "### ゲート: **Codexレビュー未着のまま通過(fail-open)**"
            echo ""
            echo "20分待ってレビューが来なかったため、no-review PR として通した。"
            echo "この緑は「レビュー済み・指摘なし」を意味しない。"
          } >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --repo "$REPO" --body \
            "🟡 **Codexレビュー未着のまま通過しました(fail-open)**。ゲートは20分待って無反応だったため no-review PR として通しています。この緑は「レビュー済み・指摘なし」ではありません。評価・選別の定義に触るPRなら、後追いでレビューを依頼してください。" \
            || echo "warning: could not post the fail-open notice comment"
