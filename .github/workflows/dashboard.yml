name: Tactical Swing OS dashboard

on:
  workflow_dispatch:
  schedule:
    # 22:10 UTC is 07:10 JST.
    - cron: "10 22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news for dashboard
        run: |
          python src/fetch_news.py --hours 24 --max-items 30 --timeout-seconds 5 --global-timeout-seconds 45 || echo "warning: news fetch failed; continuing dashboard"

      - name: Classify news narratives for dashboard
        run: |
          python src/classify_news_narratives.py || echo "warning: news narrative classification failed; continuing dashboard"

      - name: Build AI feedback for dashboard
        run: |
          python src/build_ai_feedback.py || echo "warning: AI feedback generation failed; dashboard will continue without it"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Fetch market data for pending reevaluation
        run: |
          python src/fetch_market.py || echo "warning: market fetch failed; pending reevaluation may use local fallback only"

      - name: Reevaluate pending signals for dashboard
        run: |
          python src/reevaluate_pending_signals.py --lookback-days 30 --horizon 10 || echo "warning: pending reevaluation failed; continuing dashboard"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Build latest evaluations for dashboard
        run: |
          python src/build_latest_evaluations.py || echo "warning: latest evaluations failed; continuing dashboard"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Analyze reason codes for dashboard
        run: |
          python src/analyze_reason_codes.py || echo "warning: reason code analysis failed; continuing dashboard"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Propose rule updates for dashboard
        run: |
          python src/propose_rule_updates.py || echo "warning: rule update proposals failed; continuing dashboard"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Propose model state updates for dashboard
        run: |
          python src/propose_model_state_updates.py || echo "warning: model state proposals failed; continuing dashboard"

      - name: Audit model state proposals for dashboard
        run: |
          python src/audit_model_state_proposals.py || echo "warning: model state audit failed; continuing dashboard"

      - name: Build weights patch proposal for dashboard
        run: |
          python src/build_weights_patch.py || echo "warning: weights patch proposal failed; continuing dashboard"

      - name: Review weights patch proposal for dashboard
        run: |
          python src/review_weights_patch.py || echo "warning: weights patch review failed; continuing dashboard"

      - name: Track proposal adoption for dashboard
        run: |
          python src/track_proposal_adoption.py || echo "warning: proposal adoption tracking failed; continuing dashboard"

      - name: Build weight version history for dashboard
        run: |
          python src/build_weight_version_history.py || echo "warning: weight version history failed; continuing dashboard"

      - name: Build meta learning for dashboard
        run: |
          python src/build_meta_learning.py || echo "warning: meta learning failed; continuing dashboard"

      - name: Audit datetime consistency for dashboard
        run: |
          python src/audit_datetime_consistency.py || echo "warning: datetime audit failed; continuing dashboard"

      - name: Build dashboard
        run: python src/build_dashboard.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Upload dashboard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tactical-swing-os-dashboard-${{ github.run_id }}
          if-no-files-found: error
          path: |
            reports/dashboard/index.html
            reports/dashboard/dashboard_summary.json
            results/ai_feedback.json
            results/ai_feedback.csv
            reports/ai_feedback/*.md
            reports/news/*.md
            results/news_headlines.csv
            results/news_headlines.json
            results/news_narrative_scores.csv
            results/news_narrative_scores.json
            reports/reevaluation/*.md
            results/pending_reevaluations.csv
            results/pending_reevaluations.json
            results/pending_reevaluation_summary.json
            reports/evaluations/*.md
            results/latest_evaluations.csv
            results/latest_evaluations.json
            results/latest_evaluations_summary.json
            reports/model_state/*.md
            results/model_state_update_proposals.csv
            results/model_state_update_proposals.json
            results/model_state_update_summary.json
            results/model_state_proposal_audit.csv
            results/model_state_proposal_audit.json
            results/weights_patch_proposal.csv
            results/weights_patch_proposal.json
            results/weights_patch_summary.json
            results/weights_patch_review.csv
            results/weights_patch_review.json
            results/weights_patch_review_summary.json
            results/proposal_adoption_tracking.csv
            results/proposal_adoption_tracking.json
            results/proposal_adoption_tracking_summary.json
            results/weight_version_history.csv
            results/weight_version_history.json
            results/weight_version_history_summary.json
            results/meta_learning.csv
            results/meta_learning.json
            results/meta_learning_summary.json
            results/datetime_audit.csv
            results/datetime_audit.json
            results/datetime_audit_summary.json
            reports/system/*_datetime_audit.md

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/dashboard

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
