name: Tactical Swing OS dashboard

on:
  workflow_dispatch:
  schedule:
    # 22:10 UTC is 07:10 JST.
    - cron: "10 22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build AI feedback for dashboard
        run: |
          python src/build_ai_feedback.py || echo "warning: AI feedback generation failed; dashboard will continue without it"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Build dashboard
        run: python src/build_dashboard.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Upload dashboard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tactical-swing-os-dashboard-${{ github.run_id }}
          if-no-files-found: error
          path: |
            reports/dashboard/index.html
            reports/dashboard/dashboard_summary.json
            results/ai_feedback.json
            results/ai_feedback.csv
            reports/ai_feedback/*.md

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/dashboard

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
